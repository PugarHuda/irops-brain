# Render's free tier sleeps after 15 idle minutes and takes about a minute to wake. Ping the backend through the
# public Vercel front every 10 minutes so a visitor never meets a cold start. One always-on service stays inside
# Render's 750 free hours a month.
name: keep-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -fsS --retry 5 --retry-delay 15 --max-time 120 https://irops-brain.vercel.app/api/scenarios -o /dev/null -w "%{http_code} in %{time_total}s\n"
